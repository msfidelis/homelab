apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: research-gate-frontend
  namespace: argocd
spec:
  generators:
    - list:
        elements:     
          - shard: "01"
            cluster: https://kubernetes.default.svc    
  template:
    metadata:
      name: research-gate-frontend
    spec:
      project: "research-gate"
      source:
        repoURL: 'http://chartmuseum.chartmuseum.svc.cluster.local:8080'
        chart: sample
        targetRevision: 0.1.0
        helm:
          releaseName: research-gate-frontend
          valuesObject:
            app:
              name: research-gate-frontend
              image: fidelissauro/research-gate-frontend:latest
              namespace: research-gate
              iam: "none"
              capacity:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits: 
                  cpu: 500m
                  memory: 256Mi
                autoscaling: {}
                min: 1
                max: 3
              rollout:
                strategy:
                  canary:
                    steps:
                    - setWeight: 100
              envs:
                - name: NEXT_PUBLIC_API_URL
                  value: "https://research-gate-api.homelab.fidelissauro.dev"
                - name: NEXT_PUBLIC_SITE_URL
                  value: "https://research-gate.homelab.fidelissauro.dev"
                - name: API_INTERNAL_URL
                  value: "http://research-gate-backend.research-gate.svc.cluster.local:8080"
                - name: NODE_ENV
                  value: "production"


              port:
                name: http-web
                port: 3000
                protocol: TCP
                targetPort: 3000
              service:
                type: ClusterIP
              
              # Configurações de DNS e rede
              dnsPolicy: ClusterFirst
              dnsConfig:
                options:
                  - name: ndots
                    value: "1"
                  - name: timeout
                    value: "5"
                  - name: attempts
                    value: "3"
              
              istio:
                gateway: 
                  selector: ingressgateway
                  # HTTP, HTTP2, GRPC, GRPC-WEB, MONGO, REDIS, MYSQL, TCP
                  protocol: HTTP 
                  port: 80
                host: research-gate.homelab.fidelissauro.dev
                virtualService:
                  http:
                    enabled: true
                    retries:
                      attempts: 2
                      perTryTimeout: 2s
                      retryOn: connect-failure,refused-stream,unavailable,cancelled,503
                DestinationRule:
                  enabled: true

              prometheus:
                scrape: "true"
                port: 8080
                path: /metrics

              probes:
                readinessProbe:
                  enabled: false
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
                  httpGet:
                    path: /health
                    port: 8080
                livenessProbe:
                  enabled: false
                  initialDelaySeconds: 60
                  failureThreshold: 10
                  periodSeconds: 10
                  timeoutSeconds: 5
                  httpGet:
                    path: /health
                    port: 8080
                startupProbe:
                  enabled: false
                  initialDelaySeconds: 30
                  failureThreshold: 30
                  periodSeconds: 10
                  timeoutSeconds: 5
                  httpGet:
                    path: /health
                    port: 8080

      destination:
        server: '{{ cluster }}'
        namespace: "research-gate"
      syncPolicy:
        automated: {}